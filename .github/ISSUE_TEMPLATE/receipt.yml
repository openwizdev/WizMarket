name: Shared receipt
description: Opt in to sharing the result of a WizMarket live check.
body:
  - type: input
    id: listing_id
    attributes:
      label: listing_id
      description: >-
        GitHub shows which login files this issue. Enter only the six fields below.
        Use the public WizMarket listing ID and keep private information out of every field.
    validations:
      required: true
  - type: input
    id: version_or_commit
    attributes:
      label: version_or_commit
      description: Enter the release version or the full 40-character lowercase commit SHA.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: checks
      description: Enter one public result per line, in check order, using `pass <check>:` or `fail <check>:` followed by the result.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: date
      description: Enter the UTC date of the check in YYYY-MM-DD format.
    validations:
      required: true
  - type: input
    id: os_family
    attributes:
      label: os_family
      description: Enter the lowercase operating system family, such as linux, macos, or windows.
    validations:
      required: true
  - type: input
    id: factory_id
    attributes:
      label: factory_id
      description: Enter the random lowercase UUID version 4 generated by Wiz for this factory.
    validations:
      required: true
title: Shared receipt
labels: [receipt]
